<form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!submitted">
  <label>
    Username
    <input type="text" formControlName="username" name="username" />
  </label>

  <button type="submit" [disabled]="form.invalid">Request reset</button>

  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</form>

<p *ngIf="submitted" class="success">
  If that username exists, a password reset email has been sent.
</p>
