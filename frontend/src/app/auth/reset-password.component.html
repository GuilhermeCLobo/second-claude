<div class="panel panel-narrow">
  <ng-container *ngIf="!succeeded; else done">
    <h1>Reset password</h1>
    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        Reset token
        <input type="text" formControlName="token" name="token" />
      </label>

      <label class="field">
        New password
        <input type="password" formControlName="newPassword" name="newPassword" autocomplete="new-password" />
      </label>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="form.invalid">Reset password</button>

      <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    </form>
  </ng-container>

  <ng-template #done>
    <p class="success">Your password has been reset. You can now log in.</p>
  </ng-template>
</div>
