<section class="page-form" *ngIf="!notFound">
  <h1>Edit listing</h1>

  <form class="form panel" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      Title
      <input type="text" formControlName="title" name="title" />
    </label>

    <label class="field">
      Description
      <textarea formControlName="description" name="description"></textarea>
    </label>

    <div class="field-row">
      <label class="field">
        Price
        <input type="number" formControlName="price" name="price" step="0.01" />
      </label>

      <label class="field">
        Category
        <select formControlName="category" name="category">
          <option value="" disabled>Select a category</option>
          <option *ngFor="let category of categories" [value]="category.value">{{ category.label }}</option>
        </select>
      </label>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="!form.valid">Save changes</button>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  </form>
</section>

<p *ngIf="notFound" class="not-found">Listing not found.</p>
