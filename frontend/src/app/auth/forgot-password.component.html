<div class="panel panel-narrow">
  <ng-container *ngIf="!submitted; else done">
    <h1>Forgot password</h1>
    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        Username
        <input type="text" formControlName="username" name="username" autocomplete="username" />
      </label>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="form.invalid">Request reset</button>

      <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    </form>
  </ng-container>

  <ng-template #done>
    <p class="success">If that username exists, a password reset email has been sent.</p>
  </ng-template>
</div>
