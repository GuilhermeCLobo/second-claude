<form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!registered">
  <label>
    Username
    <input type="text" formControlName="username" name="username" />
  </label>

  <label>
    Password
    <input type="password" formControlName="password" name="password" />
  </label>

  <button type="submit" [disabled]="form.invalid">Register</button>

  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</form>

<p *ngIf="registered" class="success">Registered! You can now log in.</p>
